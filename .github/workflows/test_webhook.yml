name: DiscordWebhook

on:
  workflow_dispatch:

jobs:
  deploy:
    name: Discord Webhook
    runs-on: ubuntu-24.04
    
    steps:
      - name: Discord Webhook Notify
        uses: rjstone/discord-webhook-notify@v2.3.1
        with:
          webhookUrl: ${{ secrets.DISCORD_WEBHOOK }}
          embeds: |
            - title: Webhook test
            - description: @lamrongol 通知
